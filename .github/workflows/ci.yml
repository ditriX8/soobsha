name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Локальный Supabase с нашими миграциями (база, вход, синхронизация)
      - name: Запуск Supabase
        run: npx supabase start
      - name: Ключи локального Supabase для сборки
        run: |
          npx supabase status -o env \
            | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
            | tr -d '"' > .env.local
          cat .env.local

      - run: npm run build
      - name: Проверка прав доступа и синхронизации (RLS)
        run: |
          set -a; . ./.env.local; set +a
          SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
